name: simulation
root: ~/laser_uav_system_ws/src
startup_window: control
pre_window: export PX4_NO_FOLLOW_MODE=1; export UAV_NAME=uav1; export UAV_TYPE=x500 PX4_SITL_WORLD=custom_empty
windows:
  - gazebo:
      layout: even-horizontal
      panes:
        - cd ~/git/laser_uav_system/ros_packages/laser_uav_simulation/core/scripts; ./jinja_gen.py $UAV_NAME $UAV_TYPE;
          sleep 1; cd ~/git/laser_uav_system/ros_packages/px4_firmware; PX4_UXRCE_DDS_NS=$uav_name make px4_sitl gazebo-classic_$UAV_TYPE
        - sleep 3; MicroXRCEAgent udp4 -p 8888
  - api:
      layout: even-horizontal
      panes:
        - sleep 1; ros2 launch laser_uav_px4_api api.launch.py
  - control:
      layout: tiled
      panes:
        - sleep 1; ros2 launch laser_uav_managers control_manager.launch.py
        - 'history -s ros2 service call /$uav_name/px4_api/arm std_srvs/srv/Trigger {}'
        - 'history -s ros2 service call /$uav_name/control_manager/takeoff std_srvs/srv/Trigger {}'
        - 'history -s ros2 service call /$uav_name/control_manager/land std_srvs/srv/Trigger {}'
  - trajectories:
      layout: tiled
      panes:
        - 'history -s ros2 topic pub -1 /$uav_name/control_manager/trajectory_path laser_msgs/msg/TrajectoryPath \"{speed: 1.0, waypoints: [
          {position: {x: 6.0, y: 0.0, z: 3.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: 6.0, y: 6.0, z: 3.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: 0.0, y: 6.0, z: 3.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: 0.0, y: 0.0, z: 3.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}}
        ]}\"'
        - 'history -s ros2 topic pub -1 /$uav_name/control_manager/trajectory_path laser_msgs/msg/TrajectoryPath \"{speed: 4.0, waypoints: [
          {position: {x: 3.0, y: 0.0, z: 3.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}}, 
          {position: {x: 6.0, y: 1.5, z: 3.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},  
          {position: {x: 3.0, y: 3.0, z: 3.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}}, 
          {position: {x: 0.0, y: 1.5, z: 3.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},  
          {position: {x: 3.0, y: 0.0, z: 3.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},  
          {position: {x: 0.0, y: 4.5, z: 3.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},  
          {position: {x: 3.0, y: 6.0, z: 3.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},  
          {position: {x: 6.0, y: 4.5, z: 3.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},  
          {position: {x: 3.0, y: 3.0, z: 3.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}}   
        ]}\"'
        - 'history -s ros2 topic pub -1 /$uav_name/control_manager/trajectory_path laser_msgs/msg/TrajectoryPath \"{speed: 6.0, waypoints: [
          {position: {x: -0.90, y: -1.27, z: 3.48}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: 9.09, y: 6.26, z: 1.08}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: 9.27, y: -3.46, z: 1.17}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: -4.0, y: -6.25, z: 3.40}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: 4.45, y: -0.80, z: 1.09}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: -2.65, y: 6.51, z: 1.30}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: -0.90, y: -1.27, z: 3.48}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: 9.09, y: 6.26, z: 1.08}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: 9.27, y: -3.46, z: 1.17}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: -4.0, y: -6.25, z: 3.40}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: 4.45, y: -0.80, z: 1.09}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: -2.65, y: 6.51, z: 1.30}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: -0.90, y: -1.27, z: 3.48}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: 9.09, y: 6.26, z: 1.08}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}},
          {position: {x: 9.27, y: -3.46, z: 1.17}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}}
        ]}\"'
  - free_cmd:
      layout: tiled
      panes:
        - 'history -s ros2 topic pub -1 /$uav_name/control_manager/goto geometry_msgs/msg/Pose \"{position: {x: 0.0, y: 0.0, z: 1.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}}\"'
  - free_cmd:
      layout: even-horizontal
      panes:
        - sleep 5; ros2 topic echo /odom --no-arr
        - sleep 5; ros2 topic echo /$uav_name/estimation_manager/estimation --no-arr

