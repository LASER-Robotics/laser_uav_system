name: simulation
root: ~/laser_uav_system_ws/src
startup_window: free_cmd
pre_window: export PX4_NO_FOLLOW_MODE=1; export UAV_NAME=uav1; export UAV_TYPE=x500 PX4_SITL_WORLD=custom_empty
windows:
  - gazebo:
      layout: even-horizontal
      panes:
        - cd ~/git/laser_uav_system/ros_packages/laser_uav_simulation/scripts; ./jinja_gen.py $UAV_NAME $UAV_TYPE;
          sleep 1; cd ~/git/laser_uav_system/ros_packages/px4_firmware; make px4_sitl gazebo-classic_$UAV_TYPE
        - sleep 3; MicroXRCEAgent udp4 -p 8888
  - api:
      layout: even-horizontal
      panes:
        - sleep 1; ros2 launch laser_uav_px4_api api.launch.py
  - free_cmd:
      layout: tiled
      panes:
        - 'history -s ros2 service call /uav1/arm std_srvs/srv/Trigger {}'
        - 'history -s ros2 service call /uav1/takeoff std_srvs/srv/Trigger {}'
        - 'history -s ros2 topic pub -1 /uav1/goto geometry_msgs/msg/Pose \"{position: {x: 2.0, y: 0.0, z: 1.5}, orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}}\"'
        - sleep 3; ros2 topic echo /uav1/have_goal

