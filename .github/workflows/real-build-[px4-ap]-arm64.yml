name: real-build-[px4-ap]-arm64

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with debug mode?'
        required: false
        default: 'false'

env:
  REAL_UAV: '"true"'
  UAV_NAME: '"uav1"'
  UAV_TYPE: '"x500"'

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: git/laser_uav_system

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Execute install.sh
        run: source /opt/ros/humble/setup.bash && cd "$GITHUB_WORKSPACE/git/laser_uav_system" && ./install.sh

      - name: Verify ARM64 NMPC solver and run manager tests
        run: |
          set -e
          uname -m
          file "$GITHUB_WORKSPACE/laser_uav_system_ws/install/laser_uav_controllers/lib/libacados_ocp_solver_multirotor_ode.so"
          source /opt/ros/humble/setup.bash
          export ACADOS_SOURCE_DIR="$GITHUB_WORKSPACE/laser_uav_system_ws/src/laser_uav_controllers/acados"
          export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:$ACADOS_SOURCE_DIR/lib"
          source "$GITHUB_WORKSPACE/laser_uav_system_ws/install/setup.bash"
          cd "$GITHUB_WORKSPACE/laser_uav_system_ws/build/laser_uav_managers"
          ctest --output-on-failure -E "flake8|uncrustify|cpplint|cppcheck|lint_cmake|xmllint|copyright"
