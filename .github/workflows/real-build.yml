name: real-build

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with debug mode?'
        required: false 
        default: 'false'

env:
  REAL_UAV: '"true"'
  UAV_NAME: '"uav1"'
  UAV_TYPE: '"x500"'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: /home/runner/work/laser_uav_system/laser_uav_system/git/laser_uav_system

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
            ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Execute install.sh
        run: source /opt/ros/humble/setup.bash && cd $GITHUB_WORKSPACE/git/laser_uav_system && ./install.sh
